name: Bump Version and Publish to PyPI

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - 'argo-kedro/**'

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: publish-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        ref: main
        token: ${{ secrets.GH_PAT }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Bump patch version
      working-directory: argo-kedro
      run: uv version --bump patch

    - name: Commit and push version bump
      run: |
        git config user.name "everycure"
        git config user.email "github@everycure.org"
        git add argo-kedro/pyproject.toml
        git commit -m "chore(release): bump patch version [skip ci]" || echo "No version changes to commit"
        git push origin HEAD:main
    
    - name: Copy root README into package directory
      run: cp README.md argo-kedro/README.md

    - name: Build package
      working-directory: argo-kedro
      run: python -m build
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        TWINE_REPOSITORY: pypi
      run: twine upload argo-kedro/dist/*
